name: Backend security
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: test-key-not-a-secret
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-coach-security.firebaseapp.com
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: demo-coach-security
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-coach-security.appspot.com
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '123456789'
      EXPO_PUBLIC_FIREBASE_APP_ID: '1:123456789:web:test'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npx tsc --noEmit
      - run: npx eslint . --max-warnings 0
      - run: npx prettier --check 'src/**/*.{ts,tsx}'
      - run: npx expo export -p web
      - run: npm test -- --runInBand
      - run: npm run test:backend
      - run: npm run test:security
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm audit --prefix functions --omit=dev --audit-level=high
