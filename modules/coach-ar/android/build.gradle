plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.coachar'
version = '1.0.0'

android {
  namespace 'expo.modules.coachar'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.google.ar:core:1.52.0'
  testImplementation 'junit:junit:4.13.2'
}
