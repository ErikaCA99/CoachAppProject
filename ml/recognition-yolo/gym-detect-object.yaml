openapi: 3.1.0
info:
  title: gym-detect-object
  summary: Dedicated inference endpoint for version-003 in Santiago, Chile.
  description: >
    
    | | |

    |---|---|

    | **Model** | version-003 |

    | **Location** | <img src="https://cdn.ul.run/i/flags/cl.svg" width="20"
    height="20" style="display:inline;vertical-align:middle" /> Santiago, Chile
    (`southamerica-west1`) |

    | **Deployed** | 2026-11-09 |


    Run [YOLO](https://docs.ultralytics.com/models) inference on models deployed
    on [Ultralytics Platform](https://platform.ultralytics.com). Supports all
    YOLO tasks: [detection](https://docs.ultralytics.com/tasks/detect),
    [segmentation](https://docs.ultralytics.com/tasks/segment), [semantic
    segmentation](https://docs.ultralytics.com/tasks/semantic),
    [classification](https://docs.ultralytics.com/tasks/classify), [pose
    estimation](https://docs.ultralytics.com/tasks/pose), and [oriented bounding
    boxes](https://docs.ultralytics.com/tasks/obb), and [depth
    estimation](https://docs.ultralytics.com/tasks/depth).


    ## Authentication


    Include your [Platform API
    key](https://docs.ultralytics.com/platform/account/api-keys) in the
    `Authorization` header: `Authorization: Bearer ul_xxx`


    ## Supported Inputs


    | Input | Method |

    |-------|--------|

    | **Image file** | Upload via `file` parameter |

    | **Video file** | Upload via `file` parameter (every `vid_stride`-th frame
    processed, default every frame) |

    | **Image URL** | Pass URL via `source` parameter |

    | **RTSP camera** | Stream results as server-sent events; each response ends
    after 5 minutes, so reconnect to keep watching: `curl -N -H "Accept:
    text/event-stream" -H "Authorization: Bearer ul_xxx" -F
    source=rtsp://host/stream <endpoint>/predict` |

    | **Base64 string** | Pass base64-encoded image via `source` parameter |


    **Image formats (<100 MB):** AVIF, BMP, DNG, HEIC, JP2, JPEG, JPG, MPO, PNG,
    TIF, TIFF, WEBP


    **Video formats (<100 MB):** ASF, AVI, GIF, M4V, MKV, MOV, MP4, MPEG, MPG,
    TS, WEBM, WMV


    ## Response


    Each image returns `shape`, `speed` (preprocess/inference/postprocess in
    ms), and `results` with task-specific fields:
    [detection](https://docs.ultralytics.com/tasks/detect) (`box`),
    [segmentation](https://docs.ultralytics.com/tasks/segment) (`segments`),
    [semantic segmentation](https://docs.ultralytics.com/tasks/semantic)
    (`pixel_ratio`),
    [classification](https://docs.ultralytics.com/tasks/classify) (class
    probabilities), [pose](https://docs.ultralytics.com/tasks/pose)
    (`keypoints`), [OBB](https://docs.ultralytics.com/tasks/obb) (`obb`), and
    [depth estimation](https://docs.ultralytics.com/tasks/depth) (`depth`
    grayscale PNG where depth = pixel × `max` / 255 for the default 8-bit map, /
    65535 with `bits=12|16`; 0 = no depth).


    ## Documentation


    [Inference](https://docs.ultralytics.com/platform/deploy/inference) · [REST
    API Reference](https://docs.ultralytics.com/platform/api) · [Platform
    Overview](https://docs.ultralytics.com/platform) ·
    [Quickstart](https://docs.ultralytics.com/platform/quickstart)
