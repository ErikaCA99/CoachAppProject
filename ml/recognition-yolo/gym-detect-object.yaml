paths:
  /health:
    get:
      tags:
        - Status
      summary: Health
      description: Check API health status and cached model count.
      operationId: health_health_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /:
    get:
      tags:
        - Status
      summary: Root
      description: Get API status and version information.
      operationId: root__get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
  /predict:
    post:
      tags:
        - Inference
      summary: Predict
      description: >-
        Run YOLO inference on an image or video. Include your API key:
        `Authorization: Bearer ul_xxx`.


        **Response:**

        ```json

        {
          "images": [
            {
              "shape": [480, 640],
              "results": [
                {
                  "name": "person",
                  "class": 0,
                  "confidence": 0.92,
                  "box": {"x1": 10, "y1": 20, "x2": 100, "y2": 200}
                }
              ]
            }
          ],
          "metadata": {
            "imageCount": 1,
            "functionTimeCall": 0.018
          }
        }

        ```
      operationId: predict_predict_post
      parameters:
        - name: authorization
          in: header
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            description: "Platform API key: 'Bearer ul_xxx'"
            title: Authorization
          description: "Platform API key: 'Bearer ul_xxx'"
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Body_predict_predict_post"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
        "400":
          description: Invalid input (bad file type, missing source, corrupt image)
        "401":
          description: Missing or invalid [API
            key](https://docs.ultralytics.com/platform/account/api-keys)
        "413":
          description: File exceeds 100 MB limit
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "429":
          description: Endpoint at capacity; retry after the `Retry-After` interval
        "500":
          description: Inference error
components:
  schemas:
    Body_predict_predict_post:
      properties:
        file:
          anyOf:
            - type: string
              contentMediaType: application/octet-stream
            - type: "null"
          title: File
          description: Image or video file to run inference on
        image:
          anyOf:
            - type: string
              contentMediaType: application/octet-stream
            - type: "null"
          title: Image
        model_path:
          anyOf:
            - type: string
            - type: "null"
          title: Model Path
        polygons:
          type: boolean
          title: Polygons
          default: false
        names:
          type: boolean
          title: Names
          default: false
        conf:
          type: number
          maximum: 1
          minimum: 0.01
          title: Conf
          description: Confidence threshold (0.01-1.0)
          default: 0.25
          examples:
            - 0.25
            - 0.5
            - 0.75
        iou:
          anyOf:
            - type: number
              maximum: 0.95
              minimum: 0
            - type: "null"
          title: Iou
          description: IoU threshold for NMS (0-0.95)
          examples:
            - 0.5
            - 0.7
        imgsz:
          anyOf:
            - type: integer
              maximum: 1280
              minimum: 32
            - type: "null"
          title: Imgsz
          description: Inference image size in pixels (32-1280); defaults to the model's
            training size
          examples:
            - 320
            - 640
            - 1280
        bits:
          type: integer
          title: Bits
          description: "Depth map quantization: 8 (uint8 PNG), 12, or 16 (uint16 PNG)"
          default: 8
        normalize:
          type: boolean
          title: Normalize
          description: Return normalized bounding box coordinates (0-1)
          default: false
        decimals:
          type: integer
          maximum: 10
          minimum: 0
          title: Decimals
          description: Decimal precision for coordinate values
          default: 5
          examples:
            - 3
            - 5
        vid_stride:
          type: integer
          minimum: 1
          title: Vid Stride
          description: Predict every Nth video frame
          default: 1
          examples:
            - 1
            - 5
        source:
          anyOf:
            - type: string
            - type: "null"
          title: Source
          description: "Base64-encoded image, image URL, or RTSP/RTSPS camera URL streamed
            with `Accept: text/event-stream` (alternative to file upload)"
          examples:
            - https://ultralytics.com/images/bus.jpg
      type: object
      title: Body_predict_predict_post
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: "#/components/schemas/ValidationError"
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
        cached_models:
          type: integer
          title: Cached Models
      type: object
      required:
        - status
        - cached_models
      title: HealthResponse
      description: Health check response.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
